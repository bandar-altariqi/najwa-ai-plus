name: iPhone app (Plus)

# Builds the Najwa AI Plus iPhone app (com.bandaraltariqi.najwa.plus),
# unsigned, and publishes it to this repository's ios-latest release. Nothing
# is sent to Apple (Plus must never reach Najwa AI's store listings).
#
# Run it by hand (Actions → iPhone app (Plus) → Run workflow).

on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write  # the ios-latest release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npx cap sync ios
      # Built for iPhones (arm64), without signing (signing needs an Apple
      # Developer account). The version is 1.0.<run number>.
      - name: Build the app (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-ios \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build
      - name: Check the app ID and the native engine
        run: |
          APP=build-ios/Build/Products/Release-iphoneos/App.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.bandaraltariqi.najwa.plus" || { echo "::error::The app doesn't have Plus's bundle ID"; exit 1; }
          test -d "$APP/Frameworks/llama.framework" || { echo "::error::llama.framework is missing from the app"; exit 1; }
      # An unsigned .ipa, to install with a signing tool (Sideloadly or AltStore
      # with your Apple ID).
      - name: Package
        run: |
          mkdir -p Payload
          cp -R build-ios/Build/Products/Release-iphoneos/App.app Payload/NajwaAIPlus.app
          zip -qry Najwa-AI-Plus-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: Najwa-AI-Plus-iOS-unsigned
          retention-days: 7
          path: Najwa-AI-Plus-iOS-unsigned.ipa
          if-no-files-found: error
      - name: Publish to the ios-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Najwa AI Plus for iPhone (from ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC')), unsigned. Sign it for your iPhone with Sideloadly, AltStore or a signing service and your Apple ID. It installs beside Najwa AI."
          if ! gh release view ios-latest >/dev/null 2>&1; then
            gh release create ios-latest --prerelease --target "$GITHUB_SHA" --title "Najwa AI Plus for iPhone (latest build)" --notes "$notes"
          fi
          gh release upload ios-latest Najwa-AI-Plus-iOS-unsigned.ipa --clobber
          gh release edit ios-latest --notes "$notes"
