name: Android app (Plus)

# Builds the Najwa AI Plus phone app (com.bandaraltariqi.najwa.plus) and
# attaches the APK to the run. Nothing is published: no release, no Google
# Play (Plus must never reach Najwa AI's store listings).

on:
  push:
    branches: ['main']
  workflow_dispatch:

# A newer push replaces a build still running.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Your own signing key, when set; otherwise a debug APK signed with the
      # test key in android/app (fine for your own phone).
      BALIMDA_KEYSTORE_BASE64: ${{ secrets.BALIMDA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npx cap sync android
      - name: Use your own signing key
        if: env.BALIMDA_KEYSTORE_BASE64 != ''
        run: |
          echo "$BALIMDA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/balimda.keystore"
          echo "BALIMDA_KEYSTORE_FILE=$RUNNER_TEMP/balimda.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          BALIMDA_KEYSTORE_PASSWORD: ${{ secrets.BALIMDA_KEYSTORE_PASSWORD }}
          BALIMDA_KEY_ALIAS: ${{ secrets.BALIMDA_KEY_ALIAS }}
          BALIMDA_KEY_PASSWORD: ${{ secrets.BALIMDA_KEY_PASSWORD }}
        run: |
          if [ -n "$BALIMDA_KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Najwa-AI-Plus-android.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Najwa-AI-Plus-android.apk
          fi
      - name: Check the app ID and the native engine
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging Najwa-AI-Plus-android.apk | grep -m1 "^package:" | tee badging.txt
          grep -q "name='com.bandaraltariqi.najwa.plus'" badging.txt || { echo "::error::The APK doesn't have Plus's app ID"; exit 1; }
          unzip -l Najwa-AI-Plus-android.apk | grep -q 'libbalimda_llama.so' || { echo "::error::libbalimda_llama.so is missing from the APK"; exit 1; }
      # Google sign-in (Drive sync) knows the app by its package name and this
      # fingerprint: an Android OAuth client in Google Cloud needs both.
      - name: Show the signing certificate's SHA-1
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA1=$("$APKSIGNER" verify --print-certs Najwa-AI-Plus-android.apk | grep -m1 'SHA-1 digest' | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "**Package** \`com.bandaraltariqi.najwa.plus\`, **SHA-1** \`$SHA1\` (for the Android OAuth client in Google Cloud)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: Najwa-AI-Plus-android-apk
          path: Najwa-AI-Plus-android.apk
          if-no-files-found: error
